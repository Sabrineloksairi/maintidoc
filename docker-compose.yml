# MaintiDoc – services du livrable 2
# Lancement : docker compose up -d   |   Arrêt : docker compose down
# Les mots de passe viennent du fichier .env (jamais versionné), cf. .env.example.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: maintidoc-qdrant
    ports:
      - "6333:6333"   # API REST + tableau de bord http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: maintidoc-postgres
    environment:
      POSTGRES_USER: maintidoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: maintidoc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    # Les images officielles minio/minio ont été retirées de Docker Hub et de Quay (fin 2025) :
    # on utilise l'image MinIO reconstruite et maintenue par Chainguard (gratuite, même logiciel).
    image: cgr.dev/chainguard/minio:latest
    container_name: maintidoc-minio
    user: "0"           # écriture dans le volume nommé (l'image tourne sinon en utilisateur 65532)
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?définir MINIO_ROOT_USER dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?définir MINIO_ROOT_PASSWORD dans .env}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console http://localhost:9001
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
  minio_data:
